name: Deploy Status Page

# Status-Page (pure HTML) — Build trivial, Deploy via K3s.

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: cdgs-runner
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/cosmicdriftgamestudio/status
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/cosmicdriftgamestudio/status:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          vuln-type: 'os,library'
      - name: Install kubectl
        run: |
          ARCH=$(uname -m)
          [ "$ARCH" = "aarch64" ] && ARCH=arm64 || ARCH=amd64
          VERSION=$(curl -sL https://dl.k8s.io/release/stable.txt)
          curl -sL "https://dl.k8s.io/release/${VERSION}/bin/linux/${ARCH}/kubectl" -o /tmp/kubectl
          sudo install /tmp/kubectl /usr/local/bin/kubectl
      - name: Rollout
        env:
          KUBECONFIG_DEPLOY: ${{ secrets.KUBECONFIG_DEPLOY }}
          SHA: ${{ github.sha }}
        run: |
          printf '%s\n' "$KUBECONFIG_DEPLOY" > /tmp/kubeconfig
          chmod 600 /tmp/kubeconfig
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          kubectl --kubeconfig=/tmp/kubeconfig --context=status \
            patch deployment status --type=strategic \
            -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"kumiko.io/git-sha\":\"$SHA\",\"kumiko.io/build-time\":\"$BUILD_TIME\"}}}}}"
          kubectl --kubeconfig=/tmp/kubeconfig --context=status \
            rollout status deployment status --timeout=180s
