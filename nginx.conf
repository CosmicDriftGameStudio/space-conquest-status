server {
    listen 8080;
    server_name _;

    # KRITISCH: nginx default ist port_in_redirect=on → 301 Location-Header
    # bekommt :8080 vom internen Container-Port. Hinter ingress-nginx ist
    # das Käse — Browser bekommt "https://cosmicdriftgamestudio.com:8080/foo".
    # absolute_redirect off + port_in_redirect off → relative redirects.
    absolute_redirect off;
    port_in_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Astro generiert für jede Page einen Folder mit index.html
    # (trailingSlash: 'always' default). try_files matcht das.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # SPA-fallback nicht nötig (statisch), aber 404.html sauber
    error_page 404 /404.html;
}
